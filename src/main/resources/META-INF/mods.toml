modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# GeckoLib 4 — animation engine (design doc Part 3.2 / 3.4).
# Pinned to the 4.x line: 5.x is a breaking API change and is not what this project targets.
[[dependencies.${mod_id}]]
    modId="geckolib"
    mandatory=true
    versionRange="[${geckolib_version},5)"
    ordering="AFTER"
    side="BOTH"
